      - title: Overview
        url: /strategies/
      - title: OIDC (OAuth 2.0)
        url: /strategies/oidc/
      - title: Username / Password
        url: /strategies/username-password/
      - title: Kerberos / Negotiate
        url: /strategies/kerberos/
      - title: API Key
        url: /strategies/api-key/
      - title: Custom Strategy
        url: /strategies/custom/
      - title: JWT & Refresh Tokens
        url: /jwt-tokens/

  - title: Server — ASP.NET Core
