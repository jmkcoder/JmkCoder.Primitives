# ─────────────────────────────────────────────────────────────────────────────
# JmkCoder Primitives — Jekyll / GitHub Pages
# Update `baseurl` and `url` to match your GitHub organisation and repo name.
# ─────────────────────────────────────────────────────────────────────────────

title:       JmkCoder Primitives
description: A collection of .NET 8 libraries for building modern, secure applications.

# GitHub Pages settings
baseurl: "/JmkCoder.Primitives"
url:     "https://jmkcoder.github.io"

# Link shown in the navbar
github_url: "https://github.com/jmkcoder/JmkCoder.Primitives"

# Jekyll build
markdown:   kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

permalink: /:path/

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor

# ── Top-level library navigation ─────────────────────────────────────────────
libraries:
  - title: Authentication
    url: /authentication/
    icon: bi-shield-lock-fill
    description: Plug-and-play JWT authentication for every layer of your .NET 8 stack.

  - title: Caching
    url: /caching/
    icon: bi-lightning-fill
    description: Unified caching over in-memory, Redis, and distributed providers with automatic invalidation.

  - title: Messaging
    url: /messaging/
    icon: bi-send-fill
    description: Broker-agnostic message publishing and consumption with retry, dead-letter, and transactional outbox patterns for reliable delivery.

  - title: Resilience
    url: /resilience/
    icon: bi-shield-fill-check
    description: Circuit breakers, retry policies, bulkheads, and timeouts built on Polly v8 — pre-wired for .NET DI with zero boilerplate.

  - title: Storage
    url: /storage/
    icon: bi-database-fill
    description: Abstraction over Azure Blob, S3, and local filesystem with streaming, signed URLs, and object lifecycle management.

  - title: Multitenancy
    url: /multitenancy/
    icon: bi-diagram-3-fill
    description: Tenant resolution, per-tenant configuration, and data-isolation strategies that slot into any existing ASP.NET Core application.

  - title: Observability
    url: /observability/
    icon: bi-activity
    description: OpenTelemetry-based distributed tracing, metrics, and structured logging with Serilog and Log4Net backends for .NET 8 applications.

