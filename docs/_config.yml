# ─────────────────────────────────────────────────────────────────────────────
# Primitives.Authentication — Jekyll / GitHub Pages
# Update `baseurl` and `url` to match your GitHub organisation and repo name.
# ─────────────────────────────────────────────────────────────────────────────

title:       Primitives.Authentication
description: Plug-and-play JWT authentication for every layer of your .NET 8 stack.

# GitHub Pages settings
# baseurl: sub-path if hosted at https://your-org.github.io/Primitives
baseurl: "/Primitives"
url:     "https://your-org.github.io"

# Link shown in the navbar
github_url: "https://github.com/your-org/Primitives"

# Jekyll build
markdown:   kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

permalink: /:path/

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor

# ── Sidebar navigation ────────────────────────────────────────────────────────
navigation:
  - title: Getting Started
    items:
      - title: Introduction
        url: /
      - title: Installation
        url: /getting-started/

  - title: Strategies
